name: Auto Render Earn Smart Video

on:
  repository_dispatch:
    types: [render_and_upload]
  workflow_dispatch:

jobs:
  build_video:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (For Subtitles & Fast Render)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick fonts-indic ffmpeg wget
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml || true
          sudo sed -i '/pattern="@\*"/d' /etc/ImageMagick-6/policy.xml || true

      - name: Download Hindi Font
        run: |
          wget https://github.com/google/fonts/raw/main/ofl/hind/Hind-Bold.ttf -O Hindi.ttf

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests moviepy==1.0.3 Pillow==9.5.0 edge-tts urllib3

      - name: Run Python Engine
        env:
          FULL_TEXT: ${{ github.event.client_payload.full_text }}
          SCENES_DATA: ${{ github.event.client_payload.scenes_data }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          TITLE: ${{ github.event.client_payload.title }}
          DESCRIPTION: ${{ github.event.client_payload.description }}
          THUMBNAIL_PROMPT: ${{ github.event.client_payload.thumbnail_prompt }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python render_video.py
